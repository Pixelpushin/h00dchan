[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]
# GenerateTestVectors.t.sol / GenerateFreshTestVectors.t.sol write
# breeding-app/contracts/test-vectors(.fresh).json for the downstream
# TS-parity task to consume (see spec) - forge's default fs_permissions is
# "none", so this project needs explicit write grants scoped to just those
# two files, not the whole filesystem.
fs_permissions = [
    { access = "read-write", path = "./test-vectors.json" },
    { access = "read-write", path = "./test-vectors-fresh.json" },
]

# Robinhood Chain (id 4663) - the deploy target per the design spec.
# Documented here for `forge script --rpc-url robinhood_mainnet` convenience
# ONLY. Nothing in this repo is ever run with --broadcast against it - see
# script/Deploy.s.sol's header comment.
[rpc_endpoints]
robinhood_mainnet = "https://rpc.mainnet.chain.robinhood.com"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
